<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ضرب‌المثل‌یار</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#131B33">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ضرب‌المثل‌یار">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #131B33;
    --night-2: #1D2A4D;
    --panel: #24325C;
    --ember: #E8A33D;
    --ember-dim: #B97D2A;
    --rust: #C1502E;
    --sage: #7FA872;
    --parchment: #F2E8D5;
    --thread: #D9C9A3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      linear-gradient(rgba(19,27,51,0.72), rgba(19,27,51,0.82)),
      url("background.jpg") no-repeat center center / cover fixed,
      var(--night);
    color: var(--parchment);
    font-family: 'Vazirmatn', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 24px 16px;
    overflow-x:hidden;
  }

  .coin-topbar{
    text-align: center;
    margin: 0 auto 14px;
    padding: 8px 10px 8px 18px;
    background: rgba(36,50,92,0.6);
    border: 1px solid rgba(217,201,163,0.15);
    border-radius: 20px;
    width: fit-content;
    color: var(--ember);
    font-weight: 700;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .coin-add-btn{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid rgba(217,201,163,0.4);
    background: rgba(217,201,163,0.15);
    color: var(--ember);
    font-size: 1rem;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .coin-add-btn:active{ transform: scale(0.92); }

  .coinshop-balance{
    text-align:center;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--ember);
    margin: 10px 0 20px;
  }
  .coinshop-msg{
    text-align:center;
    min-height: 1.4em;
    margin: 8px 0 4px;
    color: var(--ember);
    font-size: 0.9rem;
  }
  .ads-remaining{
    text-align:center;
    font-size: 0.85rem;
    opacity: 0.75;
    margin-top: 6px;
  }
  .coin-packs-note{
    text-align:center;
    font-size: 0.85rem;
    opacity: 0.6;
    margin-top: 26px;
  }

  .wrap{ width:100%; max-width: 560px; margin: 0 auto; }

  .screen{ width:100%; }
  .screen.hidden{ display:none; }

  header{ text-align:center; margin-bottom: 22px; position:relative; }
  .ember-glow{
    position:absolute; top:-40px; left:50%; transform:translateX(-50%);
    width:180px; height:180px; border-radius:50%;
    background: radial-gradient(circle, rgba(232,163,61,0.35), transparent 70%);
    filter: blur(4px);
    pointer-events:none;
    animation: flicker 4s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{ opacity:0.7; transform:translateX(-50%) scale(1);}
    50%{ opacity:1; transform:translateX(-50%) scale(1.06);}
  }
  h1{
    font-family:'Lalezar', sans-serif;
    font-size: 2.5rem;
    color: var(--ember);
    letter-spacing: 1px;
    position:relative;
    text-shadow: 0 0 18px rgba(232,163,61,0.35);
  }
  .subtitle{
    color: var(--thread);
    font-size: 0.9rem;
    margin-top: 4px;
    font-weight:500;
  }

  .kilim{
    height: 14px;
    margin: 18px 0;
    background:
      linear-gradient(135deg, var(--ember) 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(225deg, var(--ember) 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(315deg, var(--rust) 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(45deg, var(--rust) 25%, transparent 25%) 0 0/16px 16px;
    opacity:0.85;
    border-radius: 2px;
  }

  .card{
    background: var(--panel);
    border-radius: 18px;
    padding: 22px 20px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    border: 1px solid rgba(217,201,163,0.12);
  }

  .level-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:0.85rem; color: var(--thread); margin-bottom: 6px;
  }
  .level-row b{ color: var(--ember); font-weight:700; }
  .score{ color: var(--sage); font-weight:600; }
  #levelDifficulty{ color: var(--thread); font-size:0.75rem; margin-right:6px; }

  .word-progress{
    text-align:center;
    font-size: 0.78rem;
    color: var(--thread);
    margin-bottom: 16px;
  }
  .word-progress .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background: rgba(217,201,163,0.25); margin: 0 3px;
  }
  .word-progress .dot.done{ background: var(--sage); }
  .word-progress .dot.current{ background: var(--ember); }
  .solved-so-far{
    text-align:center;
    font-family:'Lalezar', sans-serif;
    font-size: 1.15rem;
    color: var(--thread);
    min-height: 1.6em;
    margin-bottom: 8px;
    line-height: 1.6;
  }

  /* --- mask / blanks --- */
  .mask-row{
    display:flex; gap:8px; justify-content:center; margin-bottom: 22px; flex-wrap:wrap;
  }
  .letter-box{
    width: 40px; height: 46px;
    border-radius: 10px;
    background: var(--night-2);
    border: 1.5px solid rgba(217,201,163,0.2);
    display:flex; align-items:center; justify-content:center;
    font-family:'Lalezar', sans-serif;
    font-size: 1.4rem;
    color: var(--ember);
  }
  .letter-box.given{
    border-color: var(--ember-dim);
    background: rgba(232,163,61,0.1);
  }
  .letter-box.filled{
    border-color: var(--sage);
    color: var(--sage);
    background: rgba(127,168,114,0.12);
  }
  .letter-box.attempt{
    border-color: var(--thread);
    color: var(--parchment);
    background: rgba(217,201,163,0.08);
  }
  .letter-box.wrong{ animation: shake .3s; border-color: var(--rust); }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  /* --- letter tiles pool --- */
  .tile-row{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom: 16px;
  }
  .tile{
    width: 46px; height: 46px;
    border-radius: 10px;
    background: var(--ember);
    color: var(--night);
    border:none;
    font-family:'Lalezar', sans-serif;
    font-size: 1.3rem;
    cursor:pointer;
    transition: transform .15s, opacity .15s;
  }
  .tile:hover{ transform: translateY(-2px); }
  .tile:active{ transform: scale(0.92); }
  .tile.used{ visibility:hidden; }
  .tile.wrong{ animation: shake .3s; background: var(--rust); }

  /* --- Arrange phase (word order) --- */
  .arrange-area{ text-align:center; }
  .answer-row{
    min-height: 54px;
    background: var(--night-2);
    border-radius: 12px;
    border: 1.5px dashed rgba(217,201,163,0.3);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    padding: 10px;
    margin-bottom: 16px;
  }
  .chip{
    background: var(--ember);
    color: var(--night);
    font-weight:700;
    padding: 8px 14px;
    border-radius: 20px;
    border:none;
    cursor:pointer;
    font-family:'Vazirmatn', sans-serif;
    font-size: 0.95rem;
    transition: transform .15s, opacity .15s;
  }
  .chip:hover{ transform: translateY(-2px); }
  .chip:active{ transform: scale(0.95); }
  .chip.placed{
    background: var(--panel);
    color: var(--thread);
    border: 1px solid var(--thread);
    cursor: default;
  }
  .pool{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }

  /* --- Buttons --- */
  .actions{ display:flex; gap:10px; margin-top: 18px; justify-content:center; flex-wrap:wrap;}
  button.primary{
    background: var(--ember);
    color: var(--night);
    border:none;
    padding: 11px 22px;
    border-radius: 24px;
    font-family:'Vazirmatn', sans-serif;
    font-weight:700;
    font-size: 0.95rem;
    cursor:pointer;
    transition: filter .15s, transform .15s;
  }
  button.primary:hover{ filter: brightness(1.08); transform: translateY(-1px);}
  button.primary:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  button.ghost{
    background: transparent;
    color: var(--thread);
    border: 1.5px solid rgba(217,201,163,0.3);
    padding: 11px 18px;
    border-radius: 24px;
    font-family:'Vazirmatn', sans-serif;
    font-size: 0.9rem;
    cursor:pointer;
  }
  button.ghost:hover{ border-color: var(--ember); color: var(--ember); }

  .feedback{ text-align:center; margin-top:14px; font-weight:600; min-height:1.4em; }
  .feedback.ok{ color: var(--sage); }
  .feedback.bad{ color: var(--rust); }

  .win-screen{ text-align:center; padding: 10px 0; }
  .win-screen .proverb-final{
    font-family:'Lalezar', sans-serif;
    font-size: 1.5rem;
    color: var(--ember);
    line-height: 2;
    margin: 14px 0 20px;
  }

  footer{ text-align:center; margin-top: 18px; color: var(--thread); font-size:0.75rem; opacity:0.7; }

  /* --- Menu screen --- */
  .menu-buttons{ display:flex; flex-direction:column; gap:14px; margin-bottom:10px; }
  .big-btn{ padding:16px; font-size:1.05rem; border-radius:16px; }
  .disabled-soon{
    opacity:0.55; cursor:not-allowed;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .soon-badge{ font-size:0.7rem; font-weight:500; }

  .icon-btn{
    position:fixed;
    width:44px; height:44px;
    border-radius:50%;
    background: var(--panel);
    border:1px solid rgba(217,201,163,0.25);
    display:flex; align-items:center; justify-content:center;
    font-size:1.25rem;
    cursor:pointer;
    z-index:20;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
  }
  .icon-btn.top-left{ top:16px; left:16px; }
  .icon-btn.bottom-left{ bottom:16px; left:16px; }
  .icon-btn:hover{ border-color: var(--ember); }

  /* --- Panels (support / settings) --- */
  .panel-overlay{
    position:fixed; inset:0;
    background:rgba(19,27,51,0.72);
    display:flex; align-items:stretch; justify-content:flex-start;
    z-index:50;
  }
  .panel-overlay.hidden{ display:none; }
  .side-panel{
    width: min(280px, 78vw);
    background: var(--panel);
    padding: 26px 18px;
    box-shadow: 6px 0 24px rgba(0,0,0,0.45);
    position:relative;
    border-left: 1px solid rgba(217,201,163,0.12);
    overflow-y:auto;
  }
  .close-panel{
    position:absolute; top:10px; left:12px;
    background:transparent; border:none; color:var(--thread); font-size:1.3rem; cursor:pointer;
    line-height:1;
  }
  .side-panel h3{ font-family:'Lalezar', sans-serif; color:var(--ember); font-size:1.3rem; margin-bottom:20px; }
  .panel-link{
    display:block;
    color: var(--parchment);
    background: rgba(217,201,163,0.08);
    padding: 13px 14px;
    border-radius: 12px;
    margin-bottom: 10px;
    text-decoration:none;
    font-weight:600;
    font-size:0.9rem;
  }
  .panel-link:hover{ background: rgba(232,163,61,0.18); }
  .slider-label{
    display:block; margin-bottom:24px; font-size:0.85rem; color:var(--thread);
  }
  .slider-label input[type=range]{ width:100%; margin-top:10px; accent-color: var(--ember); }

  /* --- Difficulty modal (centered) --- */
  #difficultyModal{ align-items:center; justify-content:center; }
  #difficultyModal .side-panel{
    width: min(320px, 85vw);
    border-radius:18px;
    border-left:none;
    box-shadow:0 12px 34px rgba(0,0,0,0.5);
  }

  /* --- Stage select --- */
  .stage-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; }
  .screen-title{ font-family:'Lalezar', sans-serif; color:var(--ember); font-size:1.4rem; }
  .small-btn{ padding:8px 14px; font-size:0.8rem; }

  .stage-grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:10px;
    margin-bottom:18px;
  }
  .stage-tile{
    aspect-ratio:1;
    border-radius:12px;
    background: var(--panel);
    border:1.5px solid rgba(217,201,163,0.2);
    color: var(--parchment);
    font-family:'Lalezar', sans-serif;
    font-size:1.1rem;
    cursor:pointer;
  }
  .stage-tile:hover{ border-color:var(--ember); }
  .stage-tile.done{ border-color:var(--sage); color:var(--sage); }
  .stage-tile.locked{ opacity:0.35; cursor:not-allowed; color:var(--thread); }

  .pagination{ display:flex; align-items:center; justify-content:space-between; }
  #pageIndicator{ color:var(--thread); font-size:0.85rem; }

  .game-topbar{ margin-bottom:12px; }
</style>
</head>
<body>

<!-- ===== منوی اصلی ===== -->
<div class="screen" id="screen-menu">
  <div class="icon-btn top-left" id="supportBtn" title="پشتیبانی">🎧</div>
  <div class="icon-btn bottom-left" id="settingsBtn" title="تنظیمات">⚙️</div>

  <div class="wrap">
    <div class="coin-topbar">🪙 <span id="menuCoinVal">0</span> <button class="coin-add-btn" id="coinAddBtn" title="افزایش سکه">+</button></div>
    <header>
      <div class="ember-glow"></div>
      <h1>ضرب‌المثل‌یار</h1>
      <div class="subtitle">حرف‌ها رو به ترتیب بزن تا کلمه ساخته بشه</div>
    </header>

    <div class="kilim"></div>

    <div class="menu-buttons">
      <button class="primary big-btn" id="btnStart">شروع بازی</button>
      <button class="primary big-btn disabled-soon" disabled>
        دوئل <span class="soon-badge">(به زودی)</span>
      </button>
      <button class="primary big-btn disabled-soon" disabled>
        ضرب‌المثل لری <span class="soon-badge">(به زودی)</span>
      </button>
    </div>

    <footer>ضرب‌المثل‌یار — ۱۴۰ ضرب‌المثل</footer>
  </div>
</div>

<!-- ===== فروشگاه سکه ===== -->
<div class="screen hidden" id="screen-coinshop">
  <div class="wrap">
    <div class="stage-header">
      <button class="ghost small-btn" id="backFromCoinShopBtn">→ منو</button>
      <div class="screen-title">سکه‌ها</div>
      <span></span>
    </div>
    <div class="coinshop-balance">🪙 <span id="coinShopBalance">0</span></div>
    <div class="menu-buttons">
      <button class="primary big-btn" id="watchAdBtn">🎬 تماشای تبلیغ (۱ سکه رایگان)</button>
    </div>
    <div class="ads-remaining" id="adsRemainingText"></div>
    <div class="coinshop-msg" id="coinShopMsg"></div>
    <div class="coin-packs-note">بسته‌های خرید سکه به‌زودی فعال می‌شود</div>
  </div>
</div>

<!-- ===== انتخاب مرحله ===== -->
<div class="screen hidden" id="screen-stage-select">
  <div class="wrap">
    <div class="stage-header">
      <button class="ghost small-btn" id="backToMenuBtn">→ منو</button>
      <div class="screen-title">انتخاب مرحله</div>
      <span></span>
    </div>
    <div class="stage-grid" id="stageGrid"></div>
    <div class="pagination">
      <button class="ghost" id="prevPageBtn">◀ قبلی</button>
      <span id="pageIndicator"></span>
      <button class="ghost" id="nextPageBtn">بعدی ▶</button>
    </div>
  </div>
</div>

<!-- ===== صفحه‌ی بازی ===== -->
<div class="screen hidden" id="screen-game">
  <div class="wrap">
    <div class="game-topbar">
      <button class="ghost small-btn" id="backToStagesFromGameBtn">→ مراحل</button>
    </div>
    <div class="card">
      <div class="level-row">
        <span>مرحله <b id="levelNum">1</b> از <b id="levelTotal">140</b><span id="levelDifficulty"></span></span>
        <span class="score coin">سکه: <span id="coinVal">0</span></span>
      </div>
      <div class="word-progress" id="wordProgress"></div>
      <div class="solved-so-far" id="solvedSoFar"></div>

      <div id="gameArea"></div>

      <div class="feedback" id="feedback"></div>

      <div class="actions" id="actions"></div>
    </div>
  </div>
</div>

<!-- ===== پنل پشتیبانی ===== -->
<div class="panel-overlay hidden" id="supportOverlay">
  <div class="side-panel">
    <button class="close-panel" id="closeSupportBtn">✕</button>
    <h3>پشتیبانی</h3>
    <a class="panel-link" href="https://t.me/iran_lor1" target="_blank" rel="noopener">📣 کانال تلگرام</a>
    <a class="panel-link" href="https://rubika.ir/zarbolmasalyar" target="_blank" rel="noopener">💬 روبیکا</a>
    <a class="panel-link" href="https://daramet.com/Zarbolmasalyar" target="_blank" rel="noopener">💛 حمایت از ما</a>
  </div>
</div>

<!-- ===== پنل تنظیمات ===== -->
<div class="panel-overlay hidden" id="settingsOverlay">
  <div class="side-panel">
    <button class="close-panel" id="closeSettingsBtn">✕</button>
    <h3>تنظیمات</h3>
    <label class="slider-label">صدای آهنگ پس‌زمینه
      <input type="range" id="musicSlider" min="0" max="100" value="35">
    </label>
    <label class="slider-label">صدای افکت‌های بازی
      <input type="range" id="sfxSlider" min="0" max="100" value="80">
    </label>
  </div>
</div>

<!-- ===== مودال سختی مرحله ===== -->
<div class="panel-overlay hidden" id="difficultyModal">
  <div class="side-panel">
    <button class="close-panel" id="closeDifficultyBtn">✕</button>
    <h3>سطح این مرحله</h3>
    <p style="color:var(--thread); font-size:0.85rem; margin-bottom:18px; line-height:1.8;">
      آسون: حرف اول داده می‌شه<br>سخت: بدون حرف اول
    </p>
    <div style="display:flex; gap:10px;">
      <button class="primary" id="pickEasyBtn" style="flex:1;">آسون</button>
      <button class="primary" id="pickHardBtn" style="flex:1; background:var(--rust); color:var(--parchment);">سخت</button>
    </div>
  </div>
</div>

<audio id="bgMusic" src="bg-music.mp3" loop preload="auto"></audio>
<audio id="afarinSound" src="afarin.m4a" preload="auto"></audio>

const SAVE_KEY = 'zarbolmasal_yar_progress';
const PAGE_SIZE = 15;
const HARD_MODE_START_INDEX = 70; // from stage 71 (index 70) onward: hard only

function loadProgress(){
  const fallback = { maxUnlocked:0, completed:[], coins:10, musicVolume:0.35, sfxVolume:0.8, inProgress:null, adsWatchedToday:0, adsDate:'', adStageCounter:0 };
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return fallback;
    const p = JSON.parse(raw);
    if(typeof p.maxUnlocked === 'number'){
      const maxUnlocked = Math.min(Math.max(p.maxUnlocked, 0), PROVERBS.length - 1);
      let inProgress = null;
      if(p.inProgress && typeof p.inProgress === 'object' &&
         p.inProgress.stageIndex === maxUnlocked &&
         typeof p.inProgress.wordIdx === 'number' &&
         typeof p.inProgress.lockedCount === 'number'){
        inProgress = {
          stageIndex: p.inProgress.stageIndex,
          hard: !!p.inProgress.hard,
          wordIdx: p.inProgress.wordIdx,
          lockedCount: p.inProgress.lockedCount,
          arrangePhase: !!p.inProgress.arrangePhase
        };
      }
      return {
        maxUnlocked,
        completed: Array.isArray(p.completed) ? p.completed : [],
        coins: Number.isInteger(p.coins) ? p.coins : 10,
        musicVolume: typeof p.musicVolume === 'number' ? p.musicVolume : 0.35,
        sfxVolume: typeof p.sfxVolume === 'number' ? p.sfxVolume : 0.8,
        inProgress,
        adsWatchedToday: Number.isInteger(p.adsWatchedToday) ? p.adsWatchedToday : 0,
        adsDate: typeof p.adsDate === 'string' ? p.adsDate : '',
        adStageCounter: Number.isInteger(p.adStageCounter) ? p.adStageCounter : 0
      };
    }
    // migrate from old save format { level, coins }
    const oldLevel = Number.isInteger(p.level) ? p.level : 0;
    const completed = [];
    for(let i = 0; i < oldLevel; i++) completed.push(i);
    return {
      maxUnlocked: Math.min(oldLevel, PROVERBS.length - 1),
      completed,
      coins: Number.isInteger(p.coins) ? p.coins : 10,
      musicVolume: 0.35,
      sfxVolume: 0.8,
      inProgress: null,
      adsWatchedToday: 0,
      adsDate: '',
      adStageCounter: 0
    };
  } catch(e){
    return fallback;
  }
}

let completedSet = new Set(state.completed);

let sfxVolume = state.sfxVolume;
let frontierProgress = state.inProgress; // saved mid-stage progress for the frontier stage only

const DAILY_FREE_AD_CAP = 10;

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

let adsWatchedToday = state.adsDate === todayStr() ? state.adsWatchedToday : 0;
let adsDate = todayStr();
let adStageCounter = state.adStageCounter;

function saveProgress(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      maxUnlocked, completed: [...completedSet], coins, musicVolume, sfxVolume, inProgress: frontierProgress,
      adsWatchedToday, adsDate, adStageCounter
    }));
  } catch(e){ /* ignore storage errors */ }
}

function saveFrontierProgress(){
  if(currentStageIndex !== maxUnlocked) return; // only persist deep progress for the frontier stage
  frontierProgress = {
    stageIndex: currentStageIndex,
    hard: hardMode,
    wordIdx: wordIdx,
    lockedCount: lockedUnits.length,
    arrangePhase: wordIdx >= words.length
  };
  saveProgress();
}

/* ===== coin shop =====
   window.AndroidAds is a bridge object that the native Android/Tapsell code
   will register later (via addJavascriptInterface). Until that's wired up,
   these calls simply find nothing and fall back gracefully — no ad, no
   crash, no changes needed here once Tapsell is connected. Expected native
   contract:
     window.AndroidAds.showRewardedAd()   -> must eventually call
         window.onRewardedAdEarned() on success, or
         window.onRewardedAdFailed() if no ad / user didn't finish it
     window.AndroidAds.showInterstitialAd() -> must eventually call
         window.onInterstitialClosed() once the ad is dismissed (or
         immediately if none is available)
*/
function updateCoinShopUI(){
  document.getElementById('coinShopBalance').textContent = coins;
  const remaining = Math.max(0, DAILY_FREE_AD_CAP - adsWatchedToday);
  document.getElementById('adsRemainingText').textContent =
    remaining > 0 ? `امروز ${remaining} تبلیغ رایگان دیگه می‌تونی ببینی` : 'سهمیه‌ی امروزت تموم شده، فردا دوباره سر بزن';
  document.getElementById('watchAdBtn').disabled = remaining <= 0;
}

function watchAdForCoin(){
  const msg = document.getElementById('coinShopMsg');
  msg.textContent = '';
  if(adsWatchedToday >= DAILY_FREE_AD_CAP){
    msg.textContent = 'برای امروز سهمیه‌ات تموم شده، فردا دوباره سر بزن';
    return;
  }
  if(window.AndroidAds && typeof window.AndroidAds.showRewardedAd === 'function'){
    window.onRewardedAdEarned = function(){
      window.onRewardedAdEarned = null;
      coins += 1;
      adsWatchedToday += 1;
      updateCoinDisplay();
      updateCoinShopUI();
      saveProgress();
    };
    window.onRewardedAdFailed = function(){
      window.onRewardedAdFailed = null;
      msg.textContent = 'الان تبلیغی برای نمایش نیست، کمی بعد دوباره امتحان کن';
    };
    try{
      window.AndroidAds.showRewardedAd();
    } catch(e){
      msg.textContent = 'خطا در نمایش تبلیغ';
    }
  } else {
    msg.textContent = 'این قابلیت فقط داخل اپ اندروید فعاله';
  }
}

function tryShowInterstitial(onDone){
  if(window.AndroidAds && typeof window.AndroidAds.showInterstitialAd === 'function'){
    window.onInterstitialClosed = function(){
      window.onInterstitialClosed = null;
      onDone();
    };
    try{
      window.AndroidAds.showInterstitialAd();
    } catch(e){
      window.onInterstitialClosed = null;
      onDone();
    }
  } else {
    onDone();
  }
}

function renderStageSelect(page){
  const totalPages = Math.ceil(PROVERBS.length / PAGE_SIZE);
  stagePage = Math.min(Math.max(page, 0), totalPages - 1);
  const start = stagePage * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, PROVERBS.length);

  const grid = document.getElementById('stageGrid');
  grid.innerHTML = '';
  for(let i = start; i < end; i++){
    const btn = document.createElement('button');
    const unlocked = i <= maxUnlocked;
    btn.className = 'stage-tile' + (unlocked ? '' : ' locked') + (completedSet.has(i) ? ' done' : '');
    btn.textContent = i + 1;
    btn.disabled = !unlocked;
    if(unlocked) btn.addEventListener('click', ()=> onStageTileClick(i));
    grid.appendChild(btn);
  }

  document.getElementById('pageIndicator').textContent = `صفحه ${stagePage + 1} از ${totalPages}`;
  document.getElementById('prevPageBtn').disabled = stagePage === 0;
  document.getElementById('nextPageBtn').disabled = stagePage >= totalPages - 1;
}
document.getElementById('prevPageBtn').addEventListener('click', ()=> renderStageSelect(stagePage - 1));
document.getElementById('nextPageBtn').addEventListener('click', ()=> renderStageSelect(stagePage + 1));

function onStageTileClick(i){
  if(i === maxUnlocked && frontierProgress && frontierProgress.stageIndex === i){
    // resume the frontier stage exactly where it was left, no need to re-pick difficulty
    launchStage(i, frontierProgress.hard, frontierProgress);
    return;
  }
  if(i >= HARD_MODE_START_INDEX){
    launchStage(i, true);
  } else {
    pendingStageIndex = i;
    document.getElementById('difficultyModal').classList.remove('hidden');
  }
}
document.getElementById('pickEasyBtn').addEventListener('click', ()=>{
  document.getElementById('difficultyModal').classList.add('hidden');
  launchStage(pendingStageIndex, false);
});
document.getElementById('pickHardBtn').addEventListener('click', ()=>{
  document.getElementById('difficultyModal').classList.add('hidden');
  launchStage(pendingStageIndex, true);
});
document.getElementById('closeDifficultyBtn').addEventListener('click', ()=>{
  document.getElementById('difficultyModal').classList.add('hidden');
});

function launchStage(i, hard, resume){
  const inSessionResume = (i === currentStageIndex) && (hard === hardMode) && stageActive;
  currentStageIndex = i;
  hardMode = hard;
  showScreen('game');
  if(inSessionResume){
    return; // already mid-play in this same session, keep in-memory state as-is
  }
  startLevel(i, resume);
}

/* ===== game logic ===== */
function toUnits(str){
  const chars = Array.from(str);
  const JOINERS = ['\u200C','\u200D'];
  const units = [];
  for(const ch of chars){
    if(JOINERS.includes(ch) && units.length > 0){
      units[units.length-1] += ch;
    } else {
      units.push(ch);
    }
  }
  return units;
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const PERSIAN_LETTERS = ['ا','ب','پ','ت','ث','ج','چ','ح','خ','د','ذ','ر','ز','ژ','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ک','گ','ل','م','ن','و','ه','ی'];
const HINT_COST = 3;

function startLevel(i, resume){
  words = PROVERBS[i].split(' ');
  wordIdx = resume ? resume.wordIdx : 0;
  stageActive = true;
  feedback.textContent = '';
  feedback.className = 'feedback';
  document.getElementById('levelNum').textContent = i+1;
  document.getElementById('levelDifficulty').textContent = hardMode ? '(سخت)' : '(آسون)';
  if(resume && resume.arrangePhase){
    startArrangePhase();
  } else {
    startWordGuess(resume ? resume.lockedCount : undefined);
  }
}

function renderWordProgress(){
  wordProgress.innerHTML = words.map((w,i)=>{
    const cls = i < wordIdx ? 'done' : (i===wordIdx ? 'current' : '');
    return `<span class="dot ${cls}"></span>`;
  }).join('');
}

function renderSolvedSoFar(){
  const el = document.getElementById('solvedSoFar');
  if(!el) return;
  const solvedWords = words.slice(0, wordIdx);
  el.textContent = solvedWords.length ? solvedWords.join(' ‌ ') + ' …' : '';
}

function startWordGuess(resumeLockedCount){
  const word = words[wordIdx];
  unitsAll = toUnits(word);
  givenCount = hardMode ? 0 : 1;
  const startLocked = (typeof resumeLockedCount === 'number')
    ? Math.min(Math.max(resumeLockedCount, 0), unitsAll.length)
    : givenCount;
  lockedUnits = unitsAll.slice(0, startLocked);
  attempt = [];
  pickHistory = [];

  const neededUnits = unitsAll.slice(lockedUnits.length);
  const remaining = neededUnits.map((ch,i)=>({ch, id:i, used:false}));

  if(neededUnits.length > 0){
    const decoyCount = Math.random() < 0.5 ? 1 : 2;
    for(let k=0;k<decoyCount;k++){
      const decoyCh = PERSIAN_LETTERS[Math.floor(Math.random()*PERSIAN_LETTERS.length)];
      remaining.push({ch: decoyCh, id: neededUnits.length + k, used:false, decoy:true});
    }
  }

  tiles = shuffle(remaining);
  renderWordProgress();
  renderSolvedSoFar();
  renderGuess();
  actions.innerHTML = `
    <button class="ghost" id="undoBtn">بازگشت یک حرف</button>
    <button class="ghost" id="hintBtn">💡 کمک (${HINT_COST} سکه)</button>
  `;
  document.getElementById('undoBtn').addEventListener('click', undoLetter);
  document.getElementById('hintBtn').addEventListener('click', useHint);

  if(lockedUnits.length === unitsAll.length){
    wordSuccess();
  }
}

function useHint(){
  if(coins < HINT_COST){
    feedback.textContent = 'سکه‌ی کافی نداری';
    feedback.className = 'feedback bad';
    return;
  }
  if(attempt.length > 0){
    pickHistory.forEach(id=>{
      const t = tiles.find(x=>x.id===id);
      if(t) t.used = false;
    });
    attempt = [];
    pickHistory = [];
  }

  const neededChar = unitsAll[lockedUnits.length];
  if(!neededChar) return;
  const t = tiles.find(x => x.ch === neededChar && !x.used && !x.decoy);
  if(!t) return;

  coins -= HINT_COST;
  updateCoinDisplay();
  saveProgress();

  t.used = true;
  lockedUnits.push(t.ch);
  renderGuess();
  saveFrontierProgress();

  if(lockedUnits.length === unitsAll.length){
    wordSuccess();
  }
}

function renderGuess(){
  gameArea.innerHTML = '';

  const maskRow = document.createElement('div');
  maskRow.className = 'mask-row';
  for(let i=0;i<unitsAll.length;i++){
    const box = document.createElement('div');
    if(i < lockedUnits.length){
      box.className = 'letter-box ' + (i < givenCount ? 'given' : 'filled');
      box.textContent = lockedUnits[i];
    } else if(i < lockedUnits.length + attempt.length){
      box.className = 'letter-box attempt';
      box.textContent = attempt[i - lockedUnits.length];
    } else {
      box.className = 'letter-box';
      box.textContent = '';
    }
    maskRow.appendChild(box);
  }
  gameArea.appendChild(maskRow);

  const tileRow = document.createElement('div');
  tileRow.className = 'tile-row';
  tiles.forEach(t=>{
    const btn = document.createElement('button');
    btn.className = 'tile' + (t.used ? ' used' : '');
    btn.textContent = t.ch;
    btn.disabled = t.used;
    btn.addEventListener('click', ()=>pickTile(t.id));
    tileRow.appendChild(btn);
  });
  gameArea.appendChild(tileRow);
}

function pickTile(id){
  const t = tiles.find(x=>x.id===id && !x.used);
  if(!t) return;

  t.used = true;
  attempt.push(t.ch);
  pickHistory.push(id);
  renderGuess();

  const totalLen = lockedUnits.length + attempt.length;
  if(totalLen === unitsAll.length){
    const guess = lockedUnits.concat(attempt).join('');
    if(guess === words[wordIdx]){
      wordSuccess();
    } else {
      feedback.textContent = 'اشتباهه، دوباره بچین';
      feedback.className = 'feedback bad';
      const boxes = gameArea.querySelectorAll('.letter-box.attempt');
      boxes.forEach(b=>b.classList.add('wrong'));
      setTimeout(()=>{
        pickHistory.forEach(pid=>{
          const tt = tiles.find(x=>x.id===pid);
          if(tt) tt.used = false;
        });
        attempt = [];
        pickHistory = [];
        feedback.textContent = '';
        feedback.className = 'feedback';
        renderGuess();
      }, 700);
    }
  }
}

function wordSuccess(){
  feedback.textContent = 'درسته! 👏';
  feedback.className = 'feedback ok';
  setTimeout(()=>{
    wordIdx++;
    feedback.textContent = '';
    feedback.className = 'feedback';
    saveFrontierProgress();
    if(wordIdx === words.length){
      startArrangePhase();
    } else {
      startWordGuess();
    }
  }, 500);
}

function undoLetter(){
  if(attempt.length === 0) return;
  attempt.pop();
  const lastId = pickHistory.pop();
  const t = tiles.find(x=>x.id===lastId);
  if(t) t.used = false;
  renderGuess();
}

function startArrangePhase(){
  wordProgress.innerHTML = '';
  document.getElementById('solvedSoFar').textContent = '';
  const shuffled = shuffle(words);
  let placed = [];

  gameArea.innerHTML = `
    <div class="arrange-area">
      <div class="answer-row" id="answerRow"></div>
      <div class="pool" id="pool"></div>
    </div>
  `;
  feedback.textContent = 'کلمه‌ها رو به ترتیب درست بزن';
  feedback.className = 'feedback';

  const pool = document.getElementById('pool');
  shuffled.forEach((w)=>{
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = w;
    btn.addEventListener('click', ()=>{
      placed.push(w);
      btn.remove();
      renderAnswerRow(placed);
      if(placed.length === words.length) checkArrangement(placed);
    });
    pool.appendChild(btn);
  });

  renderAnswerRow(placed);
  actions.innerHTML = `<button class="ghost" id="resetArrangeBtn">دوباره بچین</button>`;
  document.getElementById('resetArrangeBtn').addEventListener('click', startArrangePhase);
}

function renderAnswerRow(placed){
  const row = document.getElementById('answerRow');
  row.innerHTML = '';
  placed.forEach(w=>{
    const chip = document.createElement('span');
    chip.className = 'chip placed';
    chip.textContent = w;
    row.appendChild(chip);
  });
}

function checkArrangement(placed){
  const guess = placed.join(' ');
  const answer = words.join(' ');
  if(guess === answer){
    showWin();
  } else {
    feedback.textContent = 'ترتیب درست نیست، دوباره امتحان کن';
    feedback.className = 'feedback bad';
    setTimeout(startArrangePhase, 900);
  }
}

function showWin(){
  stageActive = false;
  const wasFrontier = currentStageIndex === maxUnlocked;
  const alreadyDone = completedSet.has(currentStageIndex);
  if(!alreadyDone){
    coins += 4;
    adStageCounter++;
    completedSet.add(currentStageIndex);
    if(currentStageIndex === maxUnlocked && maxUnlocked < PROVERBS.length - 1){
      maxUnlocked++;
    }
    if(wasFrontier){
      frontierProgress = null; // this stage is done now, no more deep progress to keep for it
    }
    saveProgress();
  }
  updateCoinDisplay();
  playAfarin();

  gameArea.innerHTML = `
    <div class="win-screen">
      <div>🎉 آفرین!</div>
      <div class="proverb-final">${words.join(' ')}</div>
    </div>
  `;
  feedback.textContent = '';

  const isLast = currentStageIndex === PROVERBS.length - 1;
  actions.innerHTML = `
    ${isLast ? '' : '<button class="primary" id="nextBtn">مرحله بعد</button>'}
    <button class="ghost" id="backToStagesBtn">بازگشت به مراحل</button>
  `;
  if(!isLast){
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      const goNext = () => onStageTileClick(currentStageIndex + 1);
      if(adStageCounter >= STAGES_PER_INTERSTITIAL){
        adStageCounter = 0;
        saveProgress();
        tryShowInterstitial(goNext);
      } else {
        goNext();
      }
    });
  }
  document.getElementById('backToStagesBtn').addEventListener('click', ()=>{
    renderStageSelect(Math.floor(currentStageIndex / PAGE_SIZE));
    showScreen('stage-select');
  });
}

showScreen('menu');

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>

<meta name="apple-mobile-web-app-title" content="ضرب‌المثل‌یار">

<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #131B33;
    --night-2: #1D2A4D;
    --panel: #24325C;
    --ember: #E8A33D;
    --ember-dim: #B97D2A;
    --rust: #C1502E;
    --sage: #7FA872;
    --parchment: #F2E8D5;
    --thread: #D9C9A3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(232,163,61,0.15), transparent 60%),
      var(--night);
    color: var(--parchment);
    font-family: 'Vazirmatn', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 16px;
    overflow-x:hidden;
  }

  .wrap{ width:100%; max-width: 560px; }

  header{ text-align:center; margin-bottom: 22px; position:relative; }
  .ember-glow{
    position:absolute; top:-40px; left:50%; transform:translateX(-50%);
    width:180px; height:180px; border-radius:50%;
    background: radial-gradient(circle, rgba(232,163,61,0.35), transparent 70%);
    filter: blur(4px);
    pointer-events:none;
    animation: flicker 4s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{ opacity:0.7; transform:translateX(-50%) scale(1);}
    50%{ opacity:1; transform:translateX(-50%) scale(1.06);}
  }
  h1{
    font-family:'Lalezar', sans-serif;
    font-size: 2.5rem;
    color: var(--ember);
    letter-spacing: 1px;
    position:relative;
    text-shadow: 0 0 18px rgba(232,163,61,0.35);
  }
  .subtitle{
    color: var(--thread);
    font-size: 0.9rem;
    margin-top: 4px;
    font-weight:500;
  }

  .kilim{
    height: 14px;
    margin: 18px 0;
    background:
      linear-gradient(135deg, var(--ember) 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(225deg, var(--ember) 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(315deg, var(--rust) 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(45deg, var(--rust) 25%, transparent 25%) 0 0/16px 16px;
    opacity:0.85;
    border-radius: 2px;
  }

  .card{
    background: var(--panel);
    border-radius: 18px;
    padding: 22px 20px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    border: 1px solid rgba(217,201,163,0.12);
  }

  .level-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:0.85rem; color: var(--thread); margin-bottom: 6px;
  }
  .level-row b{ color: var(--ember); font-weight:700; }
  .score{ color: var(--sage); font-weight:600; }

  .word-progress{
    text-align:center;
    font-size: 0.78rem;
    color: var(--thread);
    margin-bottom: 16px;
  }
  .word-progress .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background: rgba(217,201,163,0.25); margin: 0 3px;
  }
  .word-progress .dot.done{ background: var(--sage); }
  .word-progress .dot.current{ background: var(--ember); }
  .solved-so-far{
    text-align:center;
    font-family:'Lalezar', sans-serif;
    font-size: 1.15rem;
    color: var(--thread);
    min-height: 1.6em;
    margin-bottom: 8px;
    line-height: 1.6;
  }

  /* --- mask / blanks --- */
  .mask-row{
    display:flex; gap:8px; justify-content:center; margin-bottom: 22px; flex-wrap:wrap;
  }
  .letter-box{
    width: 40px; height: 46px;
    border-radius: 10px;
    background: var(--night-2);
    border: 1.5px solid rgba(217,201,163,0.2);
    display:flex; align-items:center; justify-content:center;
    font-family:'Lalezar', sans-serif;
    font-size: 1.4rem;
    color: var(--ember);
  }
  .letter-box.given{
    border-color: var(--ember-dim);
    background: rgba(232,163,61,0.1);
  }
  .letter-box.filled{
    border-color: var(--sage);
    color: var(--sage);
    background: rgba(127,168,114,0.12);
  }
  .letter-box.wrong{ animation: shake .3s; border-color: var(--rust); }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  /* --- letter tiles pool --- */
  .tile-row{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom: 16px;
  }
  .tile{
    width: 46px; height: 46px;
    border-radius: 10px;
    background: var(--ember);
    color: var(--night);
    border:none;
    font-family:'Lalezar', sans-serif;
    font-size: 1.3rem;
    cursor:pointer;
    transition: transform .15s, opacity .15s;
  }
  .tile:hover{ transform: translateY(-2px); }
  .tile:active{ transform: scale(0.92); }
  .tile.used{ visibility:hidden; }

  /* --- Arrange phase (word order) --- */
  .arrange-area{ text-align:center; }
  .answer-row{
    min-height: 54px;
    background: var(--night-2);
    border-radius: 12px;
    border: 1.5px dashed rgba(217,201,163,0.3);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    padding: 10px;
    margin-bottom: 16px;
  }
  .chip{
    background: var(--ember);
    color: var(--night);
    font-weight:700;
    padding: 8px 14px;
    border-radius: 20px;
    border:none;
    cursor:pointer;
    font-family:'Vazirmatn', sans-serif;
    font-size: 0.95rem;
    transition: transform .15s, opacity .15s;
  }
  .chip:hover{ transform: translateY(-2px); }
  .chip:active{ transform: scale(0.95); }
  .chip.placed{
    background: var(--panel);
    color: var(--thread);
    border: 1px solid var(--thread);
    cursor: default;
  }
  .pool{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }

  /* --- Buttons --- */
  .actions{ display:flex; gap:10px; margin-top: 18px; justify-content:center; flex-wrap:wrap;}
  button.primary{
    background: var(--ember);
    color: var(--night);
    border:none;
    padding: 11px 22px;
    border-radius: 24px;
    font-family:'Vazirmatn', sans-serif;
    font-weight:700;
    font-size: 0.95rem;
    cursor:pointer;
    transition: filter .15s, transform .15s;
  }
  button.primary:hover{ filter: brightness(1.08); transform: translateY(-1px);}
  button.primary:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  button.ghost{
    background: transparent;
    color: var(--thread);
    border: 1.5px solid rgba(217,201,163,0.3);
    padding: 11px 18px;
    border-radius: 24px;
    font-family:'Vazirmatn', sans-serif;
    font-size: 0.9rem;
    cursor:pointer;
  }
  button.ghost:hover{ border-color: var(--ember); color: var(--ember); }

  .feedback{ text-align:center; margin-top:14px; font-weight:600; min-height:1.4em; }
  .feedback.ok{ color: var(--sage); }
  .feedback.bad{ color: var(--rust); }

  .win-screen{ text-align:center; padding: 10px 0; }
  .win-screen .proverb-final{
    font-family:'Lalezar', sans-serif;
    font-size: 1.5rem;
    color: var(--ember);
    line-height: 2;
    margin: 14px 0 20px;
  }

  footer{ text-align:center; margin-top: 18px; color: var(--thread); font-size:0.75rem; opacity:0.7; }
</style>

const SAVE_KEY = 'zarbolmasal_yar_progress';

function loadProgress(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return { level: 0, coins: 10 };
    const parsed = JSON.parse(raw);
    return {
      level: Number.isInteger(parsed.level) ? parsed.level : 0,
      coins: Number.isInteger(parsed.coins) ? parsed.coins : 10
    };
  } catch(e){
    return { level: 0, coins: 10 };
  }
}

function saveProgress(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({ level, coins }));
  } catch(e){ /* ignore storage errors */ }
}

const saved = loadProgress();
let level = Math.min(saved.level, PROVERBS.length - 1);
let coins = saved.coins;
let words = [];
let wordIdx = 0;
let unitsAll = [];     // word split into visual letter units (handles نیم‌فاصله)
let filledUnits = [];  // units confirmed so far, starting with the given first letter
let pickHistory = [];  // tile ids picked, in order (for undo)
let tiles = []; // {ch, id, used}

const gameArea = document.getElementById('gameArea');
const feedback = document.getElementById('feedback');
const actions = document.getElementById('actions');
const wordProgress = document.getElementById('wordProgress');
document.getElementById('levelTotal').textContent = PROVERBS.length;
document.getElementById('coinVal').textContent = coins;

// splits a word into visual letter units, keeping a نیم‌فاصله (ZWNJ/ZWJ)
// attached to the letter before it instead of becoming its own invisible unit
function toUnits(str){
  const chars = Array.from(str);
  const JOINERS = ['\u200C','\u200D'];
  const units = [];
  for(const ch of chars){
    if(JOINERS.includes(ch) && units.length > 0){
      units[units.length-1] += ch;
    } else {
      units.push(ch);
    }
  }
  return units;
}

function startLevel(i){
  words = PROVERBS[i].split(' ');
  wordIdx = 0;
  feedback.textContent = '';
  feedback.className = 'feedback';
  document.getElementById('levelNum').textContent = i+1;
  startWordGuess();
}

function renderWordProgress(){
  wordProgress.innerHTML = words.map((w,i)=>{
    const cls = i < wordIdx ? 'done' : (i===wordIdx ? 'current' : '');
    return `<span class="dot ${cls}"></span>`;
  }).join('');
}

function renderSolvedSoFar(){
  const el = document.getElementById('solvedSoFar');
  if(!el) return;
  const solvedWords = words.slice(0, wordIdx);
  el.textContent = solvedWords.length ? solvedWords.join(' ‌ ') + ' …' : '';
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const PERSIAN_LETTERS = ['ا','ب','پ','ت','ث','ج','چ','ح','خ','د','ذ','ر','ز','ژ','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ک','گ','ل','م','ن','و','ه','ی'];

function startWordGuess(){
  const word = words[wordIdx];
  unitsAll = toUnits(word);
  filledUnits = [unitsAll[0]]; // first letter given as hint
  pickHistory = [];

  const neededUnits = unitsAll.slice(1);
  const remaining = neededUnits.map((ch,i)=>({ch, id:i, used:false}));

  // add 1-2 decoy tiles so it's not too easy to guess by elimination
  // (skip for words that are already complete with just the first letter)
  if(unitsAll.length > 1){
    const decoyCount = Math.random() < 0.5 ? 1 : 2;
    for(let k=0;k<decoyCount;k++){
      const decoyCh = PERSIAN_LETTERS[Math.floor(Math.random()*PERSIAN_LETTERS.length)];
      remaining.push({ch: decoyCh, id: neededUnits.length + k, used:false, decoy:true});
    }
  }

  tiles = shuffle(remaining);
  renderWordProgress();
  renderSolvedSoFar();
  renderGuess();
  actions.innerHTML = `
    <button class="ghost" id="undoBtn">بازگشت یک حرف</button>
    <button class="ghost" id="hintBtn">💡 کمک (${HINT_COST} سکه)</button>
  `;
  document.getElementById('undoBtn').addEventListener('click', undoLetter);
  document.getElementById('hintBtn').addEventListener('click', useHint);

  // words that are already complete with just the first letter (1-letter words)
  if(filledUnits.length === unitsAll.length){
    checkWordComplete();
  }
}

const HINT_COST = 3;

function useHint(){
  if(coins < HINT_COST){
    feedback.textContent = 'سکه‌ی کافی نداری';
    feedback.className = 'feedback bad';
    return;
  }
  const neededChar = unitsAll[filledUnits.length];
  if(!neededChar) return;
  const t = tiles.find(x => x.ch === neededChar && !x.used && !x.decoy);
  if(!t) return;

  coins -= HINT_COST;
  document.getElementById('coinVal').textContent = coins;
  saveProgress();

  t.used = true;
  filledUnits.push(t.ch);
  pickHistory.push(t.id);
  renderGuess();

  if(filledUnits.length === unitsAll.length){
    checkWordComplete();
  }
}

function renderGuess(){
  gameArea.innerHTML = '';

  const maskRow = document.createElement('div');
  maskRow.className = 'mask-row';
  for(let i=0;i<unitsAll.length;i++){
    const box = document.createElement('div');
    if(i < filledUnits.length){
      box.className = 'letter-box ' + (i===0 ? 'given' : 'filled');
      box.textContent = filledUnits[i];
    } else {
      box.className = 'letter-box';
      box.textContent = '';
    }
    maskRow.appendChild(box);
  }
  gameArea.appendChild(maskRow);

  const tileRow = document.createElement('div');
  tileRow.className = 'tile-row';
  tiles.forEach(t=>{
    const btn = document.createElement('button');
    btn.className = 'tile' + (t.used ? ' used' : '');
    btn.textContent = t.ch;
    btn.disabled = t.used;
    btn.addEventListener('click', ()=>pickTile(t.id));
    tileRow.appendChild(btn);
  });
  gameArea.appendChild(tileRow);
}

function pickTile(id){
  const t = tiles.find(x=>x.id===id && !x.used);
  if(!t) return;
  t.used = true;
  filledUnits.push(t.ch);
  pickHistory.push(id);
  renderGuess();

  if(filledUnits.length === unitsAll.length){
    checkWordComplete();
  }
}

function checkWordComplete(){
  const word = words[wordIdx];
  const guess = filledUnits.join('');
  if(guess === word){
    coins += 2;
    document.getElementById('coinVal').textContent = coins;
    saveProgress();
    feedback.textContent = 'درسته! 👏';
    feedback.className = 'feedback ok';
    setTimeout(()=>{
      wordIdx++;
      feedback.textContent = '';
      feedback.className = 'feedback';
      if(wordIdx === words.length){
        startArrangePhase();
      } else {
        startWordGuess();
      }
    }, 500);
  } else {
    feedback.textContent = 'اشتباهه، دوباره امتحان کن';
    feedback.className = 'feedback bad';
    const boxes = gameArea.querySelectorAll('.letter-box');
    boxes.forEach(b=>b.classList.add('wrong'));
    setTimeout(()=>{
      filledUnits = [unitsAll[0]];
      pickHistory = [];
      tiles.forEach(t=>t.used=false);
      feedback.textContent = '';
      feedback.className = 'feedback';
      renderGuess();
    }, 700);
  }
}

function undoLetter(){
  if(filledUnits.length <= 1) return;
  filledUnits.pop();
  const lastId = pickHistory.pop();
  const t = tiles.find(x=>x.id===lastId);
  if(t) t.used = false;
  renderGuess();
}

function startArrangePhase(){
  wordProgress.innerHTML = '';
  document.getElementById('solvedSoFar').textContent = '';
  const shuffled = shuffle(words);
  let placed = [];

  gameArea.innerHTML = `
    <div class="arrange-area">
      <div class="answer-row" id="answerRow"></div>
      <div class="pool" id="pool"></div>
    </div>
  `;
  feedback.textContent = 'کلمه‌ها رو به ترتیب درست بزن';
  feedback.className = 'feedback';

  const pool = document.getElementById('pool');
  shuffled.forEach((w)=>{
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = w;
    btn.addEventListener('click', ()=>{
      placed.push(w);
      btn.remove();
      renderAnswerRow(placed);
      if(placed.length === words.length) checkArrangement(placed);
    });
    pool.appendChild(btn);
  });

  renderAnswerRow(placed);
  actions.innerHTML = `<button class="ghost" id="resetArrangeBtn">دوباره بچین</button>`;
  document.getElementById('resetArrangeBtn').addEventListener('click', startArrangePhase);
}

function renderAnswerRow(placed){
  const row = document.getElementById('answerRow');
  row.innerHTML = '';
  placed.forEach(w=>{
    const chip = document.createElement('span');
    chip.className = 'chip placed';
    chip.textContent = w;
    row.appendChild(chip);
  });
}

function checkArrangement(placed){
  const guess = placed.join(' ');
  const answer = words.join(' ');
  if(guess === answer){
    coins += 5;
    document.getElementById('coinVal').textContent = coins;
    saveProgress();
    showWin();
  } else {
    feedback.textContent = 'ترتیب درست نیست، دوباره امتحان کن';
    feedback.className = 'feedback bad';
    setTimeout(startArrangePhase, 900);
  }
}

function showWin(){
  gameArea.innerHTML = `
    <div class="win-screen">
      <div>🎉 آفرین!</div>
      <div class="proverb-final">${words.join(' ')}</div>
    </div>
  `;
  feedback.textContent = '';
  const isLast = level === PROVERBS.length - 1;
  actions.innerHTML = isLast
    ? `<div class="feedback ok">همه‌ی ضرب‌المثل‌ها تموم شد! 👏</div>`
    : `<button class="primary" id="nextBtn">مرحله بعد</button>`;
  if(!isLast){
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      level++;
      saveProgress();
      startLevel(level);
    });
  }
}

startLevel(level);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
